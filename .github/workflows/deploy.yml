name: Desplegar sitio

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Rama, tag o commit que se desplegará
        required: true
        default: main
      operation:
        description: Tipo de operación auditada
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy

concurrency:
  group: produccion-ctprgv
  cancel-in-progress: false

jobs:
  validate:
    name: Validar versión
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener versión
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ejecutar pruebas
        env:
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: php artisan test

  deploy:
    name: Desplegar en producción
    needs: validate
    runs-on: [self-hosted, linux, x64, ctprgv-production]
    timeout-minutes: 20
    steps:
      - name: Obtener versión
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref }}

      - name: Preparar Composer actual
        run: |
          curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
          php /tmp/composer-setup.php --quiet --install-dir="$RUNNER_TEMP" --filename=composer
          rm -f /tmp/composer-setup.php

      - name: Instalar dependencias PHP
        run: php "$RUNNER_TEMP/composer" install --no-interaction --prefer-dist --no-progress --optimize-autoloader --ignore-platform-req=ext-fileinfo

      - name: Desplegar únicamente en html
        env:
          DEPLOY_OPERATION: ${{ inputs.operation }}
          DEPLOY_TARGET_REF: ${{ inputs.target_ref }}
        run: bash scripts/deploy-self-hosted.sh
