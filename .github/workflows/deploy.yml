name: Desplegar sitio

on:
  workflow_dispatch:

concurrency:
  group: produccion-ctprgv
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar y desplegar
    runs-on: [self-hosted, linux, x64, ctprgv-production]
    timeout-minutes: 20
    steps:
      - name: Obtener versión
        uses: actions/checkout@v5

      - name: Preparar Composer actual
        run: |
          curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
          php /tmp/composer-setup.php --quiet --install-dir="$RUNNER_TEMP" --filename=composer
          rm -f /tmp/composer-setup.php

      - name: Instalar dependencias PHP
        run: php "$RUNNER_TEMP/composer" install --no-interaction --prefer-dist --no-progress --optimize-autoloader --ignore-platform-req=ext-fileinfo

      - name: Ejecutar pruebas
        env:
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: php artisan test

      - name: Desplegar únicamente en html
        run: bash scripts/deploy-self-hosted.sh
